name: codeql

# Semantic security analysis, separate from the fast gate: govulncheck asks "is a known
# CVE reachable", CodeQL asks "does this code have a class of bug" (injection, path
# traversal, unsafe deserialisation). Weekly plus every change, so a finding arrives as a
# security alert rather than a red build on an unrelated PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC, off the working day
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A fork PR gets a read-only token and Dependabot's PRs cannot upload SARIF, so the
    # upload step would fail on changes that have nothing to do with the code. Push to main
    # and the weekly run still cover those.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: read
      security-events: write # upload the SARIF result
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: go
          # security-extended over security-and-quality: the latter's style queries bury
          # the findings that matter in this codebase.
          queries: security-extended
      - uses: github/codeql-action/autobuild@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: "/language:go"
