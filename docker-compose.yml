services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentops}
      POSTGRES_DB: ${POSTGRES_DB:-agentops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agentops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-agentops}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # docker compose --profile monitoring up -d   → Prometheus :9090 scrapes the router on the
  # host, Grafana :3000 (admin/admin, anonymous viewer) comes up with the datasource and the
  # router dashboard already provisioned — nothing to import by hand.
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["monitoring"]
    container_name: agentops-prometheus
    volumes:
      - ./dashboard/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["monitoring"]
    container_name: agentops-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./dashboard/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboard/grafana/router.json:/var/lib/grafana/dashboards/router.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # docker compose --profile app up -d   → the router in a container, talking to Ollama on the
  # host and to the postgres service. Run `--migrate` once: docker compose run --rm agentops --migrate
  agentops:
    build: .
    image: agentops:local
    profiles: ["app"]
    container_name: agentops
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      # No DSN literal here: the binary assembles it (defaultDSN in config.go) from these
      # parts, which are the same ones the postgres service above is started with.
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-agentops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentops}
      POSTGRES_DB: ${POSTGRES_DB:-agentops}
      FAST_MODEL: ${FAST_MODEL:-qwen2.5:3b-instruct}
      QUALITY_MODEL: ${QUALITY_MODEL:-qwen2.5:7b-instruct-q4_K_M}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  agentops-pgdata:
