name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# One run per ref at a time: a new push cancels the previous run of the same branch/PR, so
# Dependabot rebases and quick follow-up commits do not pile up in the queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; only the release job needs to write.
# Actions are pinned to full commit SHAs (the trailing comment is the tag Dependabot bumps).
permissions:
  contents: read

env:
  GOTOOLCHAIN: local   # use the setup-go toolchain, never auto-download another one

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      # Track O: the whole Go gate is scripts/verify.sh (single definition of
      # green — local runs the same file without VERIFY_RACE).
      - name: verify
        run: VERIFY_RACE=1 bash scripts/verify.sh
      # A tidy module graph is a review artefact: a stray require is either a dependency
      # decision or an accident, and both deserve to be seen in the diff.
      - name: go mod tidy
        run: go mod tidy -diff
      # The console is hand-written JS with no build step, so nothing else parses it. A
      # syntax error here ships a blank page and only the browser would notice.
      - name: console syntax
        run: node --check console/static/app.js

  # The migrations are only provable against a real Postgres: the policy test checks the
  # numbering, not the SQL. This job starts an empty pgvector database, applies the whole
  # chain, and applies it again to prove the runner is idempotent.
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tower
          POSTGRES_PASSWORD: tower
          POSTGRES_DB: tower
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tower"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: tower
      POSTGRES_PASSWORD: tower
      POSTGRES_DB: tower
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build -o tower .
      - name: apply every migration to an empty database
        run: |
          set -euo pipefail
          ./tower --migrate 2>&1 | tee /dev/stderr | grep -Eq 'applied [1-9][0-9]* new file'
      - name: a second run applies nothing
        run: ./tower --migrate 2>&1 | grep -q 'applied 0 new file'

  # Static analysis + executable policies (docs/RULES.md). Fails the build on a policy break,
  # a staticcheck finding, or a known vulnerability in the module graph.
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      # Pinned, not @latest: a scanner that changes under the build is a moving gate, and
      # `@latest` is also a supply-chain surface the rest of this workflow does not have.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      # Catch workflow mistakes (unknown keys, bad expressions) before GitHub rejects the
      # run, or worse, silently skips a step.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/ci.yml
      - name: executable policies
        run: go test -count=1 -v ./policy/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: tower:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A build that succeeds but produces a binary the distroless entrypoint cannot run is
      # the failure this step exists for; --version needs no database and no model.
      - name: smoke-test the image
        run: docker run --rm tower:ci --version

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [go, policy, docker, schema]
    # Signing and provenance need an OIDC token; the release needs to write.
    # Idempotent re-runs are fine: cosign keyless and attestations are additive.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      # Every artifact carries the tag, the commit and the build time, so
      # `tower --version-json` names the exact revision its signature covers.
      - name: build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          stamp="-X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""; [ "$os" = windows ] && ext=".exe"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=true \
                -ldflags="-s -w $stamp" -o "dist/tower-${GITHUB_REF_NAME}-${os}-${arch}${ext}" .
            done
          done
          # The stamp is a promise; check that the shipped binary carries it before signing.
          "./dist/tower-${GITHUB_REF_NAME}-linux-amd64" --version-json | grep -q "\"commit\":\"${GITHUB_SHA}\""
      # SBOM before the checksums: SHA256SUMS must cover every attached file, the SBOM
      # included, or the signature vouches for a set that is not the set that ships.
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/tower-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          # Remove first: on a re-run the old manifest would hash itself and then fail -c.
          rm -f SHA256SUMS SHA256SUMS.sigstore.json
          sha256sum -- * > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Sign the checksums, not each binary: one signature covers every artifact,
      # and the identity ties it to this workflow at this tag.
      - name: sign checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The binaries, the manifest that lists them, and the bundle that signs the
          # manifest: a verifier should not have to trust an unprovenanced checksum file.
          subject-path: |
            dist/tower-*
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
