<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tower.css">
</head>
<body>
<a class="tower-skip" href="#content">Skip to content</a>
<div class="tower-shell">
  <nav class="tower-side" aria-label="Sections">
    <div class="tower-brand">
      <div class="tower-rail-mark">T</div>
    </div>
    <button class="tower-nav-btn" data-page="overview" title="Overview" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Overview</span>
    </button>
    <button class="tower-nav-btn" data-page="traces" title="Traces">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="12" r="2"/><path d="M8 6h4a4 4 0 0 1 4 4v0M8 18h4a4 4 0 0 0 4-4v0"/></svg>
      <span>Traces</span>
    </button>
    <button class="tower-nav-btn" data-page="cockpit" title="Cockpit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="7" rx="1"/><path d="M3 15h18M7 15v5M17 15v5"/></svg>
      <span>Cockpit</span>
    </button>
    <button class="tower-nav-btn" data-page="gpu" title="GPU">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h12M6 14h8"/></svg>
      <span>GPU</span>
    </button>
    <button class="tower-nav-btn" data-page="evals" title="Evals and drift">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><path d="M4 19h16M6 16l4-5 3 3 5-7"/></svg>
      <span>Evals</span>
    </button>
    <button class="tower-nav-btn" data-page="benchmarks" title="Benchmarks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><path d="M4 20V12M10 20V6M16 20v-10M22 20H2"/></svg>
      <span>Bench</span>
    </button>
    <button class="tower-nav-btn" data-page="workflows" title="Workflows">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><rect x="3" y="4" width="6" height="6" rx="1"/><rect x="15" y="4" width="6" height="6" rx="1"/><rect x="9" y="14" width="6" height="6" rx="1"/><path d="M9 7h6M6 10v2a2 2 0 0 0 2 2h1M18 10v2a2 2 0 0 1-2 2h-1"/></svg>
      <span>Flows</span>
    </button>
    <button class="tower-nav-btn" data-page="metrics" title="Metrics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
      <span>Metrics</span>
    </button>
    <button class="tower-nav-btn" data-page="models" title="Models">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="6" rx="1"/><rect x="3" y="13" width="18" height="6" rx="1"/></svg>
      <span>Models</span>
    </button>
    <div class="tower-side-foot">
      <div class="tower-pulse-item"><span class="tower-pulse-dot" id="side-dot"></span><span id="side-router">router</span></div>
      <div class="tower-mono tower-muted" id="side-version"></div>
    </div>
  </nav>
  <div class="tower-main">
    <header class="tower-statusstrip">
      <h1 id="page-title" tabindex="-1">Overview</h1>
      <div class="tower-pulse-item">models <span class="tower-mono" id="strip-models">–</span></div>
      <div class="tower-pulse-item">faithfulness <span class="tower-mono" id="strip-faith">–</span></div>
      <div class="tower-pulse-item">p50 <span class="tower-mono" id="strip-p50">–</span></div>
      <div class="tower-pulse-item"><span class="tower-pulse-dot" id="strip-dot"></span><span id="strip-router">router</span></div>
      <span id="strip-version" hidden></span>
    </header>
    <main class="tower-content" id="content" tabindex="-1"></main>
  </div>
</div>
<!-- One narrow live region: the content region is replaced on every poll, so a
     live region on it would re-announce the whole page every five seconds. -->
<div class="tower-sr" id="announcer" role="status" aria-live="polite"></div>
<div class="tower-toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
