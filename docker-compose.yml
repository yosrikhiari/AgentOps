services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tower-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tower}
      POSTGRES_DB: ${POSTGRES_DB:-tower}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tower-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tower}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tower #/overview is the dashboard (per-model counts, p50/p99, tokens,
  # error rate, faithfulness — drawn from spans, no scrape step). /metrics stays
  # as a plain-text exposition for debugging; there is no Grafana/Prometheus
  # stack to run.

  # docker compose --profile app up -d   → the router in a container, talking to Ollama on the
  # host and to the postgres service. Run `--migrate` once: docker compose run --rm tower --migrate
  tower:
    build: .
    image: tower:local
    profiles: ["app"]
    container_name: tower
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      # No DSN literal here: the binary assembles it (defaultDSN in config.go) from these
      # parts, which are the same ones the postgres service above is started with.
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-tower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tower}
      POSTGRES_DB: ${POSTGRES_DB:-tower}
      FAST_MODEL: ${FAST_MODEL:-qwen2.5:3b-instruct}
      QUALITY_MODEL: ${QUALITY_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      # The binary defaults to 127.0.0.1; inside a container that would be the
      # container's own loopback, so the bind is widened here while the published
      # port below stays on the host's loopback. CONSOLE_REMOTE is safe only
      # because of that host-only port binding — do not widen both.
      ADDR: 0.0.0.0:8080
      CONSOLE_REMOTE: "true"
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tower-pgdata:
